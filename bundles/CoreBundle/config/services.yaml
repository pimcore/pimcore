services:
    _defaults:
        autowire: true
        autoconfigure: true

    # NOTE: the telemetry contributor interfaces are autoconfigured container-wide in
    # PimcoreCoreExtension, not with `_instanceof` here - `_instanceof` would only tag services
    # defined in this file, leaving collectors shipped by other bundles undiscovered.

    #
    # SECURITY
    #

    # Only use with Symfony ver 5.3 or higher
    # Decorate the symfony encoder factory with our own. Encoders operating on pimcore admin users and pimcore objects using
    # the password field definition need access to the user instance while encoding the password. Our factory allows delegating
    # encoder building to sub-factories which are able to build and cache an encoder per user object.
    #
    # See UserAwareEncoderFactory which is used from the admin bundle and from CMS demo profile.
    #
    # The second argument (factory mapping) is read from config (pimcore.security.password_hasher_factories) and set by the extension.
    pimcore.security.password_hasher_factory:
        class: Pimcore\Security\Hasher\PasswordHasherFactory
        decorates: security.password_hasher_factory
        arguments: ['@.inner', '@?']

    #
    # INFRASTRUCTURE
    #

    # creates needed pimcore directories
    Pimcore\HttpKernel\CacheWarmer\MkdirCacheWarmer:
        tags:
            - { name: kernel.cache_warmer }

    Pimcore\HttpKernel\CacheWarmer\PimcoreCoreCacheWarmer:
        tags:
            - { name: kernel.cache_warmer }

    Pimcore\Cache\Symfony\CacheClearer:
        public: true

    Pimcore\Helper\LongRunningHelper:
        public: true
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: pimcore }

    #
    # CONFIG
    #
    Pimcore\Config:
        public: true

    Pimcore\Config\ReportConfigWriter: ~

    #
    # CONTROLLERS
    #

    # auto-register all controllers as services
    Pimcore\Bundle\CoreBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

    Pimcore\Controller\Config\ControllerDataProvider:
        public : true
        arguments:
            $serviceControllers: '%pimcore.service_controllers%'
            $templateProviders: !tagged_iterator pimcore.template_provider

    Pimcore\Controller\Config\Template\ProjectTemplateProvider:
        tags: [ 'pimcore.template_provider' ]

    Pimcore\Controller\Config\Template\BundleTemplateProvider:
        tags: [ 'pimcore.template_provider' ]

    Pimcore\Controller\Config\Template\TemplateFinder: ~

    Pimcore\Controller\Config\Bundle\BundleProvider: ~

    #
    # HTTP/REST clients
    #

    Pimcore\Http\ClientFactory:
        # keep this public until static method was removed
        public: true

    pimcore.http_client:
        alias: GuzzleHttp\Client
        public: true

    GuzzleHttp\Client:
        public: true
        class: \GuzzleHttp\Client
        factory: ['@Pimcore\Http\ClientFactory', createClient]

    # DataObject Consent Service
    Pimcore\DataObject\Consent\Service:
        public: true

    Pimcore\Model\DataObject\ClassDefinition\ClassDefinitionManager:
        public: true

    Pimcore\Model\DataObject\ClassDefinition\DynamicOptionsProvider\CountryOptionsProvider:
        public: true

    Pimcore\Mail\Plugins\RedirectingPlugin: ~

    # Decorates Symfony Mailer
    Pimcore\Mail\Mailer:
        decorates: mailer
        arguments:
            - '@Pimcore\Mail\Mailer.inner'
            - '@Pimcore\Mail\Plugins\RedirectingPlugin'
        public: true

    Pimcore\Translation\TranslationEntriesDumper: ~

    Pimcore\Model\DataObject\QuantityValue\UnitConversionService:
        public: true
    Pimcore\Model\DataObject\QuantityValue\Service: ~

    Pimcore\Model\DataObject\QuantityValue\QuantityValueConverterInterface:
        public: true
        class: Pimcore\Model\DataObject\QuantityValue\DefaultConverter

    Pimcore\Bundle\CoreBundle\Request\ParamResolver\DataObjectParamResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 101}

    Symfony\Component\Lock\PersistingStoreInterface:
        class: Symfony\Component\Lock\Store\DoctrineDbalStore
        arguments:
            - '@doctrine.dbal.default_connection'

    Symfony\Component\Lock\LockFactory:
        public: true
        class: Symfony\Component\Lock\LockFactory
        arguments:
            - '@Symfony\Component\Lock\PersistingStoreInterface'

    Pimcore\Model\Paginator\EventSubscriber\PaginateListingSubscriber: ~

    Pimcore\Tool\Storage:
        public: true
        arguments:
            $locator: !tagged_locator { tag: flysystem.storage }

    Pimcore\Asset\StorageQueue\StorageOperationQueueRepository:
        arguments:
            - '@doctrine.dbal.default_connection'

    Pimcore\Asset\StorageQueue\StorageOperationQueueRepositoryInterface:
        alias: Pimcore\Asset\StorageQueue\StorageOperationQueueRepository

    Pimcore\Asset\StorageQueue\FrontendPathResolver:
        public: true
        arguments:
            - '@Pimcore\Asset\StorageQueue\StorageOperationQueueRepositoryInterface'
            - '%pimcore.assets.storage_operation_queue.enabled%'

    # Static wiring: the queue-aware adapters always decorate the flysystem adapters; the runtime
    # `enabled` flag (last argument) makes every public method a pass-through when the feature is
    # off, so a disabled install never touches the storage_operation_queue repository/table.
    pimcore.asset.storage_queue.adapter.asset:
        class: Pimcore\Asset\StorageQueue\QueueAwareStorageAdapter
        decorates: flysystem.adapter.pimcore.asset.storage
        arguments:
            - '@.inner'
            - '@Pimcore\Asset\StorageQueue\StorageOperationQueueRepositoryInterface'
            - 'asset'
            - false
            - '%pimcore.assets.storage_operation_queue.enabled%'

    pimcore.asset.storage_queue.adapter.thumbnail:
        class: Pimcore\Asset\StorageQueue\QueueAwareStorageAdapter
        decorates: flysystem.adapter.pimcore.thumbnail.storage
        arguments:
            - '@.inner'
            - '@Pimcore\Asset\StorageQueue\StorageOperationQueueRepositoryInterface'
            - 'thumbnail'
            - true
            - '%pimcore.assets.storage_operation_queue.enabled%'

    pimcore.asset.storage_queue.adapter.asset_cache:
        class: Pimcore\Asset\StorageQueue\QueueAwareStorageAdapter
        decorates: flysystem.adapter.pimcore.asset_cache.storage
        arguments:
            - '@.inner'
            - '@Pimcore\Asset\StorageQueue\StorageOperationQueueRepositoryInterface'
            - 'asset_cache'
            - true
            - '%pimcore.assets.storage_operation_queue.enabled%'

    pimcore.asset.storage_queue.processor:
        class: Pimcore\Asset\StorageQueue\StorageOperationQueueProcessor
        arguments:
            - !service_locator
                asset: '@pimcore.asset.storage_queue.adapter.asset.inner'
                thumbnail: '@pimcore.asset.storage_queue.adapter.thumbnail.inner'
                asset_cache: '@pimcore.asset.storage_queue.adapter.asset_cache.inner'
            - '@Pimcore\Asset\StorageQueue\StorageOperationQueueRepositoryInterface'
            - '@logger'

    Pimcore\Image\Adapter\Imagick:
        shared: false
        public: true

    Pimcore\Helper\SymfonyExpression\ExpressionServiceInterface:
        public: true
        class: Pimcore\Helper\SymfonyExpression\ExpressionService

    Pimcore\Image\Adapter\GD:
        shared: false
        public: true

    Pimcore\Model\Version\Adapter\VersionStorageAdapterInterface:
        public: true
        alias: Pimcore\Model\Version\Adapter\FileSystemVersionStorageAdapter

    Pimcore\Model\Version\Adapter\FileSystemVersionStorageAdapter: ~

    Pimcore\Model\Version\CoauthorContextInterface:
        public: true
        alias: Pimcore\Model\Version\CoauthorContext

    Pimcore\Model\Version\CoauthorContext: ~

    # request-scoped memoization of element permission lookups (DAO result only), cleared per
    # request and per messenger message via the kernel.reset tag.
    # public, because it is consumed from the AbstractElement model via the container — like the
    # workflow Manager and the event dispatcher already are — and models are not container-managed
    # so they cannot receive it through constructor injection.
    Pimcore\Model\Element\PermissionCache:
        public: true
        tags:
            - { name: kernel.reset, method: reset }
    #
    # SECURITY
    #

    # standard user provider returning admin users wrapped in a Pimcore\Security\User\User proxy object.
    # using this user provider allows implementations to authenticate against pimcore users on every desired firewall
    Pimcore\Security\User\UserProvider:
        public: true

    Pimcore\Security\User\TokenStorageUserResolver:
        public: true
        arguments:
            - '@security.token_storage'

    Pimcore\Security\User\UserLoader: ~

    # user-checker checking pimcore users for validity
    Pimcore\Security\User\UserChecker: ~

    #
    # System Settings Services
    #
    Pimcore\SystemSettingsConfig:
        public: true


    #
    # Notification Services
    #

    Pimcore\Model\Notification\Service\NotificationService:
        public: true

    Pimcore\Console\CommandContextHolder: ~


    Pimcore\Bundle\CoreBundle\EventListener\ConsoleCommandListener:
        tags:
            - { name: 'kernel.event_subscriber' }

    Pimcore\Model\Notification\Service\UserService: ~

    Pimcore\Tool\StatisticsManager:
        arguments:
            $instanceIdentifier: '%pimcore.product_registration.instance_identifier%'
            $config: '%pimcore.config%'

    #
    # TELEMETRY (collected -> durable spool -> product-key-encrypted -> first-party relay; content-never)
    #
    Pimcore\Telemetry\TelemetryInterface:
        class: Pimcore\Telemetry\Telemetry
        arguments:
            $instanceIdentifier: '%pimcore.product_registration.instance_identifier%'
            $productKey: '%pimcore.product_registration.product_key%'
            $spool: '@Pimcore\Telemetry\Spool\TelemetrySpool'
            # deployment discriminators for the group key; the domain is HMAC'd, never sent
            $environment: '%kernel.environment%'
            $mainDomain: '%pimcore.telemetry.main_domain%'

    # authenticated encryption of the batch envelope, keyed by the product key (mirrored on the relay)
    Pimcore\Telemetry\Crypto\EnvelopeCipher: ~

    Pimcore\Telemetry\Spool\TelemetrySpool:
        arguments:
            $cap: '%pimcore.telemetry.spool.cap%'
            $ttlDays: '%pimcore.telemetry.spool.ttl_days%'
            $leaseSeconds: '%pimcore.telemetry.spool.lease_seconds%'

    # drain seam: claim -> encrypt with the product key -> hand to a drainer (maintenance job / Studio UI)
    Pimcore\Telemetry\Spool\TelemetryOutboxInterface:
        class: Pimcore\Telemetry\Spool\TelemetryOutboxService
        arguments:
            $spool: '@Pimcore\Telemetry\Spool\TelemetrySpool'
            $instanceIdentifier: '%pimcore.product_registration.instance_identifier%'
            $productKey: '%pimcore.product_registration.product_key%'

    # direct HTTP delivery to the relay, used by the maintenance drain task
    Pimcore\Telemetry\Relay\RelayClientInterface:
        class: Pimcore\Telemetry\Relay\RelayClient
        arguments:
            $endpoint: '%pimcore.telemetry.relay_endpoint%'

    # framework-level content-never guard (event-name taxonomy + scalar-only properties)
    Pimcore\Telemetry\EventSanitizer: ~

    Pimcore\Telemetry\Snapshot\Bucketizer: ~

    # time-boxes every snapshot collector query so a full scan on a huge table (path-depth, GROUP BY)
    # aborts instead of stalling the maintenance run; collectors autowire this in place of Connection
    Pimcore\Telemetry\Snapshot\SnapshotQueryRunner:
        arguments:
            $timeoutSeconds: '%pimcore.telemetry.snapshot_query_timeout_seconds%'

    # element statistics (counts-by-type, tree depth, fan-out) behind an interface so a bundle that
    # owns a search index (Studio via the Generic Data Index) can decorate it with index aggregations;
    # the SQL default is always available and is the runtime fallback.
    Pimcore\Telemetry\Snapshot\Statistics\ElementStatisticsProviderInterface:
        class: Pimcore\Telemetry\Snapshot\Statistics\SqlElementStatisticsProvider

    Pimcore\Telemetry\Snapshot\CoreSnapshotCollector:
        arguments:
            $environment: '%kernel.environment%'
            $debugMode: '%kernel.debug%'
            $timezone: '%pimcore.telemetry.timezone%'

    # evidence for EM question #1 - which pillars (DAM/PIM/MDM/DXP/Commerce) are actually used
    Pimcore\Telemetry\Snapshot\PillarUsageCollector: ~

    Pimcore\Telemetry\Snapshot\FieldTreeAnalyzer: ~

    Pimcore\Telemetry\Snapshot\DataModelComplexityCollector: ~

    Pimcore\Telemetry\Snapshot\CatalogShapeCollector: ~

    # active-bundle list, resolved once per snapshot (enumerating them costs ~1 statement per bundle)
    Pimcore\Telemetry\Snapshot\ActiveBundles: ~

    # reads the session statement counter so the snapshot can report its own DB cost as meta.*
    Pimcore\Telemetry\Snapshot\StatementCounter: ~

    Pimcore\Telemetry\Snapshot\SnapshotBuilder:
        arguments:
            $collectors: !tagged_iterator pimcore.telemetry.snapshot_collector
            $statementCounter: '@Pimcore\Telemetry\Snapshot\StatementCounter'

    # last-snapshot marker (SettingsStore-backed) used to throttle snapshot production
    Pimcore\Telemetry\Snapshot\TelemetrySnapshotStateInterface:
        class: Pimcore\Telemetry\Snapshot\SettingsStoreSnapshotState

    # bundle usage: is a bundle actually USED (not just installed)? Aggregates every tagged
    # BundleUsageProviderInterface into usage.<bundleKey>. Other bundles just register a provider.
    Pimcore\Telemetry\Usage\BundleUsageCollector:
        arguments:
            $providers: !tagged_iterator pimcore.telemetry.bundle_usage_provider

    # reference provider (core capability): are any workflows configured?
    Pimcore\Telemetry\Usage\WorkflowUsageProvider: ~

    # Doctrine schema filter to only include managed tables
    Pimcore\Db\ManagedTablesOnlyFilter.default:
        class: Pimcore\Db\ManagedTablesOnlyFilter
        arguments:
            $registry: '@doctrine'
            $commandContextHolder: '@Pimcore\Console\CommandContextHolder'
        tags:
            - { name: doctrine.dbal.schema_filter, connection: default }

    pimcore.calculated_value.expression_language:
        class: Pimcore\Helper\SymfonyExpression\CalculatedFieldExpressionLanguage
        public: true
        arguments:
            - !tagged_iterator pimcore.calculated_value.expression_language_provider
