services:
    _defaults:
        autowire: true
        autoconfigure: true

    Pimcore\Bundle\InstallBundle\:
        resource: '../src/'
        exclude:
            - '../src/Event/'
            - '../src/EnvVarDefinition/'
            - '../src/Profile/'
            - '../src/Collector/'
            - '../src/Env/'
            - '../src/Checkpoint/'

    Pimcore\Bundle\InstallBundle\Command\:
        resource: '../src/Command'
        public: true
        tags: ['console.command']

    Pimcore\Bundle\InstallBundle\Installer:
        public: true
