imports:
    - { resource: ../../config.yaml }

# this cache is used during tests when setting up pimcore
framework:
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                tags: true
                default_lifetime: 31536000  # 1 year
                adapter: cache.adapter.array


doctrine:
    dbal:
        connections:
            default:
                server_version: '10.11'
                url: '%pimcore_test.db.dsn%'
                host: ~
                port: ~
                dbname: ~
                user: ~
                password: ~
                mapping_types:
                    bit: boolean

pimcore:
    product_registration:
        instance_identifier: '%env(PIMCORE_INSTANCE_IDENTIFIER)%'
        product_key: '%env(PIMCORE_PRODUCT_KEY)%'
    objects:
        class_definitions:
            data:
                map:
                    # custom field type used by BlockTest::testCustomMarshallerValueObjectInsideBlock()
                    customValueObject: Pimcore\Tests\Support\Helper\DataType\CustomValueObjectField
        block:
            unserialize_allowed_classes:
                - Pimcore\Tests\Support\Helper\DataType\CustomValueObject


parameters:
    pimcore_test.db.dsn: '%env(PIMCORE_TEST_DB_DSN)%'
    env(PIMCORE_TEST_DB_DSN): ~
    pimcore.encryption.secret: '%env(PIMCORE_ENCRYPTION_SECRET)%'
