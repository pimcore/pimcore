services:
    redis:
        image: redis:alpine
        command: [ redis-server, --maxmemory 128mb, --maxmemory-policy volatile-lru, --save "" ]

    db:
        image: mariadb:10.7
        working_dir: /application
        command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_520_ci, --innodb-file-per-table=1]
        environment:
            MYSQL_ROOT_PASSWORD: ROOT
            MYSQL_DATABASE: pimcore_test
            MYSQL_USER: pimcore
            MYSQL_PASSWORD: pimcore

    php:
#        user: '1000:1000' # set to your uid:gid
        image: pimcore/pimcore:php8.4-debug-latest
        environment:
            PIMCORE_ENCRYPTION_SECRET: "def00000ad77c36a568b35a6b38fd862609e9db6eac59585405fa179ae89199f217eb6c8ffb3c63223734302753686dfaa126bdc74302b84689a09dc87babda938e6cdeb"
            PIMCORE_INSTANCE_IDENTIFIER: "4q7D8GcezCZp2rhuTt7xk8"
            PIMCORE_PRODUCT_KEY: ""
            PHP_IDE_CONFIG: "serverName=localhost"
            COMPOSER_HOME: /var/www/html
            PIMCORE_PROJECT_ROOT: /var/www/html
            APP_ENV: test
            PIMCORE_TEST: 1
            PIMCORE_TEST_DB_DSN: "mysql://pimcore:pimcore@db:3306/pimcore_test"
            PIMCORE_TEST_REDIS_DSN: "redis://redis:6379"
        depends_on:
            - db
        volumes:
            - ../../.:/var/www/html
            - /var/www/html/vendor
            - /var/www/html/kernel
            - /var/www/html/config
            - /var/www/html/templates
            - /var/www/html/bin
            - /var/www/html/src
            - /var/www/html/public
            - /var/www/html/var
